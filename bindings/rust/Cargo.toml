[package]
name = "delarocha"
version = "0.1.0"
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
description = "Japanese morphological analyzer (MeCab/Vibrato-compatible tokenizer) in Rust with an optional Zig core"
readme = "../../README.md"
homepage = "https://github.com/bokuweb/delarocha"
documentation = "https://docs.rs/delarocha"
keywords = ["japanese", "tokenizer", "morphological", "mecab", "nlp"]
categories = ["text-processing", "parser-implementations"]
build = "build.rs"
include = [
    "/src/**/*.rs",
    "/build.rs",
    "/prebuilt/**",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]
vibrato-system = ["dep:vibrato", "dep:zstd"]
zig-ffi = []
vibrato-bench = ["vibrato-system"]

[dependencies]
csv = "1"
memmap2 = "0.9"
thiserror = "2"
vibrato = { version = "0.5", optional = true, default-features = false }
wasm-bindgen = { version = "0.2", optional = true }
zstd = { version = "0.13", optional = true }

[dev-dependencies]
criterion = "0.8"
tempfile = "3"

[[bench]]
name = "tokenize"
harness = false

[package.metadata.docs.rs]
features = ["vibrato-system"]
